# Supply-chain policy for the small, security-critical sidecar.
# `cargo deny check` runs in CI on every change.

[advisories]
version = 2
# v2 denies vulnerabilities, unsoundness, and notices by default.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
# Dependencies are all standard Rust permissive licenses. Add no copyleft or
# unknown license without an explicit review.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
