[package]
name = "sapi-egress"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Transparent egress allowlist sidecar for sapi: fake DNS, TLS-SNI and HTTP-Host filtering, connect-by-name relay."
license = "MIT"
repository = "https://github.com/sapiensmalti/sapi"
publish = false

[[bin]]
name = "sapi-egress"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.29", features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[dev-dependencies]
serde_json = "1"
