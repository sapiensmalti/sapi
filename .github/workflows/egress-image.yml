name: egress-image
# Builds and publishes ghcr.io/<owner>/sapi-egress on tags `egress-v*`.
# Each architecture is compiled natively, pushed by digest, then merged into
# one manifest list. The resulting digest is what `sapi` pins.
on:
  push:
    tags: ["egress-v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sapi-egress

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push by digest
        id: build
        run: |
          docker build -f egress/Dockerfile -t "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}" egress
          docker push "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_REF_NAME}-${{ matrix.arch }}" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > "digest-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create manifest list
        run: |
          version="${GITHUB_REF_NAME#egress-v}"
          amd64="$(cat digests/digest-amd64)"; arm64="$(cat digests/digest-arm64)"
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$version"
          echo "## sapi-egress $version" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest.Digest}}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  source:
    # The exact source of this tag, as a checksummed tarball on the release,
    # so `SAPI_EGRESS_BUILD=1` can build the sidecar locally from pinned
    # source instead of pulling the registry image.
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: archive and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#egress-v}"
          git archive --format=tar.gz --prefix=sapi-egress/ "$GITHUB_REF_NAME" egress > "sapi-egress-src-$version.tar.gz"
          sha256sum "sapi-egress-src-$version.tar.gz" | tee SHA256SUMS
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          printf 'image = %s@%s\nsource_sha256 = %s\n' "$IMAGE" "$digest" "$(cut -d' ' -f1 SHA256SUMS)" > PINS
          gh release create "$GITHUB_REF_NAME" "sapi-egress-src-$version.tar.gz" SHA256SUMS PINS \
            --title "sapi-egress $version" --notes "Sidecar image: \`$IMAGE:$version\` (\`$digest\`). Source tarball checksum in SHA256SUMS. Pin both in \`sapi\`."
