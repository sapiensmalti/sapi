name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: test/check.sh

  egress:
    name: egress (fmt, clippy, tests, image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egress
      - run: cd egress && cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
      - run: docker build -f egress/Dockerfile -t sapi-egress:ci egress
      - run: docker run --rm sapi-egress:ci --version

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: test/smoke.sh

  install:
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install from this checkout
        run: SAPI_URL="file://$PWD/sapi" bash install.sh
      - run: ~/.local/bin/sapi version && ~/.local/bin/sapi help >/dev/null
