name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install shellcheck (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: test/check.sh
        env:
          DEBUG: ${{ runner.os == 'macOS' && 1 || 0 }}

  egress:
    name: egress (fmt, clippy, tests, image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: egress
      - run: cd egress && cargo fmt --check && cargo clippy --all-targets --all-features --locked -- -D warnings && cargo clippy --all-targets --locked -- -D warnings && cargo test --all-features --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
          manifest-path: egress/Cargo.toml
      - run: docker build -f egress/Dockerfile -t sapi-egress:ci egress
      - run: docker run --rm sapi-egress:ci --version

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: test/smoke.sh

  macos-smoke:
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: start an isolated Linux Docker VM
        run: |
          brew install colima docker docker-buildx
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sf "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" "$HOME/.docker/cli-plugins/docker-buildx"
          colima start --vm-type=vz --cpu 2 --memory 4 --disk 20
      - name: real Docker smoke on macOS
        env:
          TMPDIR: ${{ runner.temp }}
        run: test/smoke.sh
      - name: remove the VM
        if: always()
        run: colima delete --force || true
